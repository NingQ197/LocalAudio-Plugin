name: Prepare README artwork
on:
  push:
    paths:
      - docs/assets/creator-card.png.base64
      - .github/workflows/readme-art.yml
permissions:
  contents: write
jobs:
  artwork:
    if: github.repository == 'NingQ197/LocalAudio-Plugin'
    runs-on: ubuntu-latest
    steps:
      - name: Store README image
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request, urllib.error
          repo = os.environ['REPOSITORY']
          assert repo == 'NingQ197/LocalAudio-Plugin'
          root = 'https://api.github.com/repos/' + repo + '/contents/'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def call(path, method='GET', data=None):
              body = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(root + path, data=body, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          source = call('docs/assets/creator-card.png.base64')
          encoded = base64.b64decode(source['content']).decode('ascii').strip()
          image = base64.b64decode(encoded, validate=True)
          assert len(image) == 297687
          assert hashlib.sha256(image).hexdigest() == '4db6587c4d4d7ad0b2ad5896950049b6c44c6368e5e44b1973a75afd111d9a28'
          body = {'message': 'Add creator artwork to README footer', 'content': encoded, 'branch': 'main', 'author': {'name': 'github-actions[bot]', 'email': '41898282+github-actions[bot]@users.noreply.github.com'}}
          try:
              previous = call('docs/assets/creator-card.png')
              body['sha'] = previous['sha']
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          call('docs/assets/creator-card.png', 'PUT', body)
          print('README artwork stored.')
          PY
